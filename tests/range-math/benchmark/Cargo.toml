[package]
name = "range-math-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
paired = []

[lib]
path = "src/lib.rs"

[[bench]]
name = "ranges"
harness = false

[[bench]]
name = "paired"
harness = false
required-features = ["paired"]

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.dev]
debug = 0
overflow-checks = true

[profile.release]
debug = 0
overflow-checks = true
lto = false
codegen-units = 1
panic = "abort"
